# ===============================
# = SERVER CONFIGURATION
# ===============================
server:
  port: 8080
  web:
    error:
      include-message: always

spring:
  application:
    name: contact management system

    # ===============================
    # = DATABASE CONFIGURATION
    # ===============================
  datasource:
    url: jdbc:sqlserver://DESKTOP-9REPN8F\\SERVER2022:1433;databaseName=contactdb;encrypt=true;trustServerCertificate=true
    username: SuperAdmin
    password: SuperAdmin
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ===============================
  # = JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

# ===============================
# = LOGGING (Slf4j + Logback)
# ===============================
logging:
  level:
    org.springframework: INFO
    com.example: DEBUG